name: Portfolio CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  tests:
    name: Pytest + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Start portfolio server
        run: |
          python server.py > /tmp/portfolio-server.log 2>&1 &
          echo $! > /tmp/portfolio-server.pid

          for i in {1..15}; do
            if curl --fail http://localhost:8000 > /dev/null 2>&1; then
              echo "Portfolio server is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Portfolio server failed to start"
          cat /tmp/portfolio-server.log
          exit 1

      - name: Run tests
        run: |
          pytest -v


  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t portfolio-web .